# Configuration autonome : ne pas la fusionner avec le Compose de développement.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:?Initialiser .env.prod}-backend:production
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  env_file: .env.prod
  environment:
    INITIALISE_DATABASE: "false"
  networks: [private]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes: [mysql_data:/var/lib/mysql]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    networks: [private]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  # Broker dédié : le cache peut être vidé/évincé sans perdre les tâches.
  task-broker:
    image: rabbitmq:4.1-alpine
    hostname: task-broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Configurer le compte du broker}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Configurer le mot de passe du broker}
    volumes: [task_broker_data:/var/lib/rabbitmq]
    networks: [private]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  worker:
    <<: *backend
    restart: unless-stopped
    command: [celery, -A, api.services.background:celery_app, worker, --loglevel=INFO, --concurrency=2, --hostname=worker@%h]
    volumes: [backend_uploads:/app/static/uploads]
    depends_on:
      migrate:
        condition: service_completed_successfully
      task-broker:
        condition: service_healthy
    stop_grace_period: 330s
    healthcheck:
      test: [CMD-SHELL, 'celery -A api.services.background:celery_app inspect ping --destination "worker@$$HOSTNAME" --timeout 5 | grep -q pong']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  migrate:
    <<: *backend
    restart: "no"
    command: [python, -m, scripts.migrate]
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    volumes:
      - backend_uploads:/app/static/uploads
      - backend_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthcheck/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:?}
    restart: unless-stopped
    # Ne pas injecter .env.prod ici : le frontend n’a pas besoin des secrets SQL/JWT.
    environment:
      BACKEND_URL: http://backend:8000
      APP_ORIGIN: ${APP_ORIGIN:?}
      SESSION_COOKIE_SECURE: "true"
    networks: [private, edge]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?}
      TLS_EMAIL: ${TLS_EMAIL:?}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      frontend:
        condition: service_healthy
    logging: *logging

networks:
  private:
  edge:

volumes:
  task_broker_data:
  mysql_data:
  backend_uploads:
  backend_logs:
  caddy_data:
  caddy_config:
