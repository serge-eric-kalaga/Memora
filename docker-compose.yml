# Memora local : PostgreSQL persistant, API et interface conteneurisées.
# Utiliser scripts/memora-docker-start.sh après import des données existantes.
name: memora
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: memora
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: ${MEMORA_POSTGRES_PASSWORD:?Exécuter scripts/memora-docker-env.py}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${MEMORA_POSTGRES_PORT:-5433}:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U memora -d memora"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "false"
    volumes: [mail_data:/data]
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    logging: *logging
  backend:
    image: memora-backend:local
    build: {context: ./backend, dockerfile: Dockerfile.prod}
    user: "${MEMORA_DOCKER_UID:-10001}:${MEMORA_DOCKER_GID:-10001}"
    restart: unless-stopped
    env_file:
      - path: ./.memora/docker/backend.env
        format: raw
    environment:
      MEMORA_DATA_DIR: ${MEMORA_DATA_PATH:?}
      MEMORA_INFERENCE_URL: http://host.docker.internal:8091
      MEMORA_OLLAMA_URL: http://host.docker.internal:11434
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      MEMORA_SMTP_HOST: mailpit
      MEMORA_SMTP_PORT: "1025"
      INITIALISE_DATABASE: "false"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - type: bind
        source: ${MEMORA_DATA_PATH:?}
        target: ${MEMORA_DATA_PATH:?}
      - ${MEMORA_UPLOAD_PATH:?}:/app/static/uploads
      - ${MEMORA_DOCKER_LOG_PATH:?}:/app/logs
    ports: ["127.0.0.1:8080:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    stop_grace_period: 120s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthcheck/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    logging: *logging
  frontend:
    image: memora-frontend:local
    build: {context: ./frontend, dockerfile: Dockerfile.prod}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      MEMORA_LOCAL: "1"
      APP_ORIGIN: http://127.0.0.1:3000
      SESSION_COOKIE_SECURE: "false"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    logging: *logging
volumes:
  postgres_data:
  mail_data:
