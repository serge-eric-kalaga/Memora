global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: backend
    file_sd_configs:
      - files: [/etc/prometheus/targets.yml]
    relabel_configs:
      - source_labels: [role]
        regex: metrics
        action: keep
    metrics_path: /metrics
  - job_name: http-probes
    metrics_path: /probe
    params:
      module: [http_ok]
    file_sd_configs:
      - files: [/etc/prometheus/targets.yml]
    relabel_configs:
      - source_labels: [role]
        regex: probe
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: mysql
    static_configs:
      - targets: [mysql-exporter:9104]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
