name: CI Memora
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Identités synthétiques réservées aux runners jetables, jamais de secret réel.
env:
  APP_NAME: Memora CI
  ADMINS_EMAIL: ci@example.invalid
  SECRET_KEY: ci-only-secret-not-for-production
  JWT_SECRET: ci-only-jwt-not-for-production
  ALGORITHM: HS256
  CACHE_ENABLED: 'false'
  EMAIL_VERIFICATION_ENABLED: 'false'
  MEMORA_DISABLE_WORKER: '1'
  EMAIL_HOST: 127.0.0.1
  EMAIL_PORT: '9'
  EMAIL_DOMAIN: example.invalid
  EMAIL_USERNAME: ci
  EMAIL_PASSWORD: ci-only
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  backend:
    name: Backend SQLite et contrats isolés
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_PREFIX: memora:ci:backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Installer les dépendances verrouillées
        run: uv sync --frozen --project backend --group dev
      - name: Vérifier contrat OpenAPI, lint et scripts Memora
        run: |
          cd backend
          uv run --frozen python scripts/export_openapi.py --check
          uv run --frozen ruff check --config pyproject.toml . ../scripts
          uv run --frozen python -m unittest discover -s ../scripts/tests -v
      - name: Tests backend sur stockage jetable et Redis isolé
        run: python scripts/memora-test.py
      - name: Vérifier les migrations des comptes sur SQLite jetable
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/memora-ci-migrations.db
          INITIALISE_DATABASE: 'false'
        run: uv run --frozen python scripts/check_migrations.py

  postgres:
    name: PostgreSQL16 et import synthétique
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memora_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U memora_ci -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Installer les dépendances verrouillées
        run: uv sync --frozen --project backend --group dev
      - name: Créer deux bases neuves à noms aléatoires réservés aux tests
        run: |
          backend/.venv/bin/python - <<'PY'
          import os
          import secrets
          import psycopg
          from psycopg import sql
          prefix = 'postgresql://memora_ci:ci-only-password@127.0.0.1:5432/'
          with psycopg.connect(prefix + 'postgres', autocommit=True) as connection:
              with open(os.environ['GITHUB_ENV'], 'a') as environment:
                  for variable in ('MEMORA_TEST_POSTGRES_URL', 'MEMORA_TEST_IMPORT_URL'):
                      name = 'memora_test_' + secrets.token_hex(8)
                      connection.execute(sql.SQL('CREATE DATABASE {}').format(sql.Identifier(name)))
                      environment.write(variable + '=' + prefix + name + '\n')
          PY
      - name: Contrats PostgreSQL réels, isolation, concurrence et import exact
        run: >-
          python scripts/memora-test.py
          test/test_memora_postgres_live.py
          test/test_memora_postgres_import.py -q
      # Le service PostgreSQL entier est jetable ; aucune base existante n’est utilisée.

  frontend:
    name: Frontend Memora
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      MEMORA_LOCAL: '1'
      NEXT_PUBLIC_APP_NAME: Memora
      MEMORA_DATA_DIR: /tmp/memora-ci-http-data
      DATABASE_URL: sqlite:////tmp/memora-ci-http-accounts.db
      BACKEND_URL: http://127.0.0.1:8080
      BACKEND_TEST_URL: http://127.0.0.1:8080
      FRONTEND_TEST_URL: http://127.0.0.1:3000
      FRONTEND_URL: http://127.0.0.1:3000
      APP_ORIGIN: http://127.0.0.1:3000
      SESSION_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Installer les dépendances verrouillées
        run: |
          npm ci
          uv sync --frozen --project ../backend
      - name: Vérifier contrat et SDK généré
        run: |
          (cd ../backend && uv run --frozen python scripts/export_openapi.py --check)
          npm run api:check
      - name: Lint, types et tests frontend isolés
        run: |
          npm run lint
          npm run typecheck
          npm run test:i18n
          npm run test:admin-cache
      - name: Construire Memora optimisé
        run: npm run build:memora
      - name: Parcours comptes HTTP sur services exclusivement jetables
        shell: bash
        run: |
          set -euo pipefail
          backend_log="$RUNNER_TEMP/memora-backend.log"
          frontend_log="$RUNNER_TEMP/memora-frontend.log"
          backend_pid=''
          frontend_pid=''
          cleanup() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ]; then cat "$backend_log" "$frontend_log" || true; fi
            if [ -n "$frontend_pid" ]; then kill "$frontend_pid" 2>/dev/null || true; fi
            if [ -n "$backend_pid" ]; then kill "$backend_pid" 2>/dev/null || true; fi
            exit "$result"
          }
          trap cleanup EXIT
          (cd ../backend && exec uv run --frozen uvicorn run:app --host 127.0.0.1 --port 8080) >"$backend_log" 2>&1 &
          backend_pid=$!
          npm run start -- --hostname 127.0.0.1 >"$frontend_log" 2>&1 &
          frontend_pid=$!
          python ../scripts/wait_for_http.py http://127.0.0.1:8080/api/healthcheck/ http://127.0.0.1:3000/api/auth/config
          npm run test:api
          npm run test:passwords
          npm run test:generated-api

  docker-config:
    name: Configuration Docker locale
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Préparer une configuration synthétique sans télécharger de modèle
        run: |
          python3 scripts/memora-env.py
          python3 scripts/memora-docker-env.py
          docker compose --env-file .memora/docker/compose.env -f docker-compose.yml config --quiet
          sh -n scripts/memora-docker-start.sh scripts/memora-docker-stop.sh scripts/memora-docker-status.sh
      # MLX/ECAPA natifs nécessitent le Mac local ; aucun faux test IA dans ce job Linux.
